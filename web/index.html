<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>XML 安全检查台</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>XML 安全检查台</h1>
  <p class="sub">仅在本机运行 · 不访问网络 · 不读取样例目录之外的文件</p>
</header>

<section class="toolbar">
  <select id="sample-select"><option value="">— 选择内置样例 —</option></select>
  <button id="load-sample">载入样例</button>
  <label class="file-btn">导入本地 XML 文件
    <input type="file" id="file-input" accept=".xml,text/xml,text/plain">
  </label>
  <button id="inspect-btn" class="primary">开始检查</button>
  <button id="clear-btn">清空</button>
  <span id="input-size" class="muted"></span>
</section>

<main>
  <div class="pane">
    <h2>待检查 XML</h2>
    <textarea id="xml-input" spellcheck="false"
      placeholder="在此粘贴 XML，或载入样例 / 导入文件"></textarea>
  </div>

  <div class="pane">
    <h2>检查结果</h2>
    <div id="status-banner" class="banner hidden"></div>
    <div id="stats" class="stats hidden"></div>

    <h3>诊断</h3>
    <ul id="diagnostics" class="diagnostics"><li class="muted">尚未检查</li></ul>

    <h3>解析结构</h3>
    <div id="tree" class="tree muted">尚未检查</div>

    <h3>原文定位</h3>
    <div id="source" class="source muted">点击诊断条目可定位到原文行</div>
  </div>
</main>

<script src="/static/app.js"></script>
</body>
</html>
