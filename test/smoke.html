<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF 逐帧检查器</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>GIF 逐帧检查器</h1>
  <div class="toolbar">
    <label class="btn file-btn">
      打开 GIF…<input type="file" id="fileInput" accept=".gif,image/gif" hidden>
    </label>
    <span class="sep"></span>
    <span class="label">内置样例：</span>
    <span id="sampleButtons"></span>
  </div>
</header>

<div id="globalInfo" class="global-info">未加载文件。可打开本地 GIF，或点击内置样例（含一个故意截断的文件）。</div>

<main>
  <section class="views">
    <figure>
      <figcaption>合成后的整帧（含本帧区域框）</figcaption>
      <div class="canvas-wrap checker"><canvas id="compositeCanvas"></canvas></div>
    </figure>
    <figure>
      <figcaption>本帧局部数据（未合成，原始尺寸）</figcaption>
      <div class="canvas-wrap checker"><canvas id="rawCanvas"></canvas></div>
    </figure>
  </section>

  <section class="side">
    <h2>帧信息</h2>
    <table id="frameInfo" class="kv"></table>
    <h2>播放</h2>
    <div class="controls">
      <button id="btnPrev" title="上一帧 (←)">⏮</button>
      <button id="btnPlay" title="播放/暂停 (空格)">▶</button>
      <button id="btnNext" title="下一帧 (→)">⏭</button>
      <span id="playPos" class="play-pos"></span>
    </div>
    <p class="hint">播放使用浏览器归一化时序（&lt;20ms 的帧按 100ms 计）；检查结果与导出保留原文件时间。</p>
    <h2>导出</h2>
    <div class="controls">
      <button id="btnExport">导出 PNG 序列 + 时间清单 (zip)</button>
    </div>
    <div id="exportStatus" class="export-status"></div>
  </section>
</main>

<section class="timeline-section">
  <h2>时间线 <span class="hint" id="timelineHint"></span></h2>
  <div id="timeline" class="timeline"></div>
  <div class="legend">
    <span><i class="sw d0"></i>未指定/保留</span>
    <span><i class="sw d2"></i>恢复为背景</span>
    <span><i class="sw d3"></i>恢复为此前画面</span>
    <span><i class="sw zero"></i>零时长帧</span>
    <span><i class="sw seam"></i>循环接缝</span>
    <span><i class="sw trans"></i>含透明色</span>
  </div>
</section>

<script src="js/gif.js"></script>
<script src="js/encoder.js"></script>
<script src="js/app.js"></script><script src="test/smoke-page.js"></script>
</body>
</html>
