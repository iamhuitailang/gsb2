{% extends "base.html" %}
{% block content %}
<h1>新建规则草稿</h1>
{% if base %}
<p class="muted">基于 v{{ base['version_no'] }} 的配置预填。保存后将生成新的草稿版本号。</p>
{% endif %}
<form method="post" action="{{ url_for('rule_create') }}">
  <label>重量下限（kg）</label>
  <input type="number" step="any" name="weight_min" value="{{ config['weight']['min'] }}" required>
  <label>重量上限（kg）</label>
  <input type="number" step="any" name="weight_max" value="{{ config['weight']['max'] }}" required>
  <label>服务类型允许值（逗号分隔）</label>
  <input type="text" name="service_types" value="{{ config['service_types'] | join(',') }}" required>
  <label>
    <input type="checkbox" name="cold_chain_requires_temp_zone"
           {% if config['cold_chain_requires_temp_zone'] %}checked{% endif %}
           style="width:auto"> 冷链包裹必须填写温区
  </label>
  <label>版本说明</label>
  <input type="text" name="note" placeholder="例如：重量上限降至 15kg">
  <p><button class="btn" type="submit">保存草稿</button></p>
</form>
{% endblock %}
