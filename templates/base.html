<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>{% block title %}规则工作台{% endblock %}</title>
  <style>
    body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; color: #222; }
    nav { background: #1f3a5f; padding: 10px 24px; }
    nav a { color: #fff; margin-right: 18px; text-decoration: none; }
    main { max-width: 1080px; margin: 24px auto; padding: 0 16px; }
    table { border-collapse: collapse; width: 100%; margin: 12px 0; }
    th, td { border: 1px solid #ddd; padding: 6px 10px; text-align: left; font-size: 14px; }
    th { background: #f4f6f8; }
    .tag { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 12px; }
    .tag-published { background: #d9f2e3; color: #18723b; }
    .tag-draft { background: #fdf0d5; color: #8a5a00; }
    .tag-archived { background: #eee; color: #666; }
    .pass { color: #18723b; } .reject { color: #b3261e; }
    .chg-pass_to_reject { background: #fde7e7; }
    .chg-reject_to_pass { background: #e3f4e8; }
    .chg-reason_changed { background: #fff8e1; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin: 12px 0; }
    .btn { display: inline-block; padding: 6px 14px; border: 1px solid #1f3a5f; border-radius: 4px;
           background: #1f3a5f; color: #fff; cursor: pointer; text-decoration: none; font-size: 14px; }
    .btn.secondary { background: #fff; color: #1f3a5f; }
    input[type=text], input[type=number], textarea { padding: 6px; width: 320px; font-size: 14px; }
    textarea { width: 100%; height: 140px; font-family: monospace; }
    label { display: block; margin: 10px 0 4px; font-weight: 600; }
    .muted { color: #777; font-size: 13px; }
    ul.reasons { margin: 0; padding-left: 18px; }
  </style>
</head>
<body>
<nav>
  <a href="{{ url_for('index') }}">工作台首页</a>
  <a href="{{ url_for('rule_list') }}">规则版本</a>
  <a href="{{ url_for('rule_new') }}">新建草稿</a>
  <a href="{{ url_for('batch_new') }}">新建批次</a>
  <a href="{{ url_for('dryrun_new') }}">发起预跑</a>
</nav>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
