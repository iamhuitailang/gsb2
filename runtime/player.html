<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>运行时播放器 · 2D 骨骼动画</title>
  <style>
    body { margin: 0; background: #0b1422; color: #cfe0f5;
      font-family: -apple-system, "PingFang SC", sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { padding: 10px 14px; background: #121f33; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    button, select { background: #1b2d47; color: #cfe0f5; border: 1px solid #2c4262; border-radius: 6px; padding: 6px 12px; cursor: pointer; }
    button.primary { background: #2563b8; color: #fff; }
    canvas { flex: 1; width: 100%; }
    .hint { font-size: 12px; color: #7d93b1; }
  </style>
</head>
<body>
  <header>
    <strong>运行时播放器</strong>
    <button id="loadBtn">载入 .runtime.json</button>
    <button id="sampleBtn" class="primary">载入内置示例</button>
    <select id="animSelect"></select>
    <label class="hint">播放速率
      <select id="rateSelect">
        <option value="0.25">0.25x</option><option value="0.5">0.5x</option>
        <option value="1" selected>1x</option><option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </label>
    <button id="playBtn">暂停</button>
    <span class="hint" id="info">请先载入数据</span>
    <input type="file" id="fileInput" accept=".json" hidden>
  </header>
  <canvas id="screen"></canvas>

  <script src="runtime.js"></script>
  <script>
    const canvas = document.getElementById('screen');
    const ctx = canvas.getContext('2d');
    let player = null, last = performance.now(), rate = 1;

    function resize() {
      const dpr = devicePixelRatio || 1;
      canvas.width = canvas.clientWidth * dpr;
      canvas.height = canvas.clientHeight * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    window.addEventListener('resize', resize);

    function loadData(data) {
      player = new SkeletonPlayer(data);
      const sel = document.getElementById('animSelect');
      sel.innerHTML = data.animations.map((a, i) =>
        `<option value="${a.id}">${a.name}（${a.frameRate}fps / ${a.frameCount}帧 / ${a.loop ? '循环' : '单次'}）</option>`).join('');
      player.play(data.animations[0].name);
      document.getElementById('info').textContent =
        '骨骼 ' + data.bones.length + ' · 部件 ' + data.parts.length + ' · IK ' + data.ik.length + ' · 动作 ' + data.animations.length;
    }

    function frame(now) {
      const dt = Math.min((now - last) / 1000, 0.05);
      last = now;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (player) {
        player.update(dt * rate);
        ctx.save();
        ctx.translate(canvas.clientWidth / 2, canvas.clientHeight / 2 + 120);
        player.draw(ctx);
        ctx.restore();
      }
      requestAnimationFrame(frame);
    }

    document.getElementById('loadBtn').addEventListener('click', () => document.getElementById('fileInput').click());
    document.getElementById('fileInput').addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => loadData(JSON.parse(r.result));
      r.readAsText(f);
    });
    document.getElementById('sampleBtn').addEventListener('click', () => fetch('../tools/sample.runtime.json').then((r) => r.json()).then(loadData));
    document.getElementById('animSelect').addEventListener('change', (e) => {
      const a = player.data.animations.find((x) => x.id === e.target.value);
      player.anim = a; player.time = 0;
    });
    document.getElementById('rateSelect').addEventListener('change', (e) => rate = parseFloat(e.target.value));
    document.getElementById('playBtn').addEventListener('click', (e) => {
      if (!player) return;
      player.playing = !player.playing;
      e.target.textContent = player.playing ? '暂停' : '播放';
    });

    resize();
    requestAnimationFrame(frame);
  </script>
</body>
</html>
