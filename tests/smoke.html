<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>smoke</title></head>
<body>
<!-- 复刻 index.html 中的关键 DOM，id 与 app.js 依赖保持一致 -->
<input type="file" id="file-input"><input type="file" id="video-input">
<select id="mode-select">
  <option value="ms">毫秒</option>
  <option value="frame">帧</option>
</select><input id="fps-input" value="25">
<button id="export-srt"></button><button id="export-vtt"></button>
<button id="add-cue"></button><button id="clear-all"></button>
<button id="undo-text"></button><button id="redo-text"></button>
<button id="undo-time"></button><button id="redo-time"></button>
<button id="zoom-in"></button><button id="zoom-out"></button><button id="zoom-fit"></button>
<input id="search-input"><input id="replace-input">
<input type="checkbox" id="opt-case"><input type="checkbox" id="opt-regex">
<button id="replace-all"></button>
<div id="search-error" class="hidden"></div><div id="search-count"></div><div id="search-results"></div>
<div id="list"></div><div id="issue-panel"></div><div id="parse-errors" class="hidden"></div>
<div id="stat-count"></div><div id="stat-issues"></div><div id="stat-file"></div><div id="zoom-label"></div>
<div id="mode-label"></div><div id="toast"></div>
<div id="drop-overlay" class="hidden"></div>
<video id="video" preload="metadata"></video>
<div id="timeline-wrap" style="width:1200px;height:180px;"><canvas id="timeline" style="width:1200px;height:180px;"></canvas></div>

<script src="../js/time.js"></script>
<script src="../js/serializer.js"></script>
<script src="../js/parser.js"></script>
<script src="../js/history.js"></script>
<script src="../js/validator.js"></script>
<script src="../js/timeline.js"></script>
<script src="../js/app.js"></script>
<script>
/*
 * 浏览器端到端冒烟测试：模拟真实用户的导入、校验、撤销重做、搜索替换、
 * 帧模式编辑与导出往返。由 tests/cdp-run.js 通过 CDP 驱动并读取结果。
 * 结果写入 #toast（JSON），完成后 title 置为 SMOKE_DONE。
 */
window.__smokeError = null;
window.addEventListener('error', (e) => { window.__smokeError = e.message + ' @ ' + e.filename + ':' + e.lineno; });
const results = [];
const ok = (c, m) => results.push({ pass: !!c, msg: m + (c ? '' : ' [FAIL]') });
function fire(el, type) { el.dispatchEvent(new Event(type, { bubbles: true })); }
const wait = (ms) => new Promise((r) => setTimeout(r, ms));

async function loadSubtitle(text, name) {
  const file = new File([text], name, { type: 'text/plain' });
  const dt = new DataTransfer();
  dt.items.add(file);
  const fi = document.getElementById('file-input');
  fi.files = dt.files;
  fire(fi, 'change');
  await wait(100);
}

window.addEventListener('load', async () => {
  try {
    // 1. 导入样例 SRT（走真实 FileReader 路径）
    await loadSubtitle(await (await fetch('../samples/sample.srt')).text(), 'sample.srt');
    ok(document.querySelectorAll('#list .cue-row').length === 4, '导入 SRT 后渲染 4 条字幕');
    ok(document.querySelectorAll('#list textarea')[0].value.includes('<欢迎语>'), '第一条原文与特殊字符保留');
    ok(document.getElementById('parse-errors').classList.contains('hidden'), '正常文件无导入错误提示');

    // 2. 时间轴 Canvas 已按 DPR 初始化
    const cv = document.getElementById('timeline');
    ok(cv.width > 0 && cv.height > 0, 'Canvas 已按 DPR 设置尺寸 ' + cv.width + 'x' + cv.height);

    // 3. 样例初始无校验问题
    ok(document.getElementById('issue-panel').textContent.includes('未发现问题'), '样例初始无校验问题');

    // 4. 模拟视频元数据（测试桩 video 不会真正加载媒体）
    const videoEl = document.getElementById('video');
    Object.defineProperty(videoEl, 'duration', { value: 12, configurable: true });
    videoEl.dispatchEvent(new Event('loadedmetadata'));
    await wait(60);

    // 4a. 第一条终点拉长到 4000ms，与第二条重叠
    const endInput0 = document.querySelector('#list .cue-row .t-end');
    endInput0.value = '00:00:04,000';
    fire(endInput0, 'change');
    ok(document.getElementById('issue-panel').textContent.includes('重叠'), '检出重叠');
    const toggleBtn = [...document.querySelectorAll('#issue-panel button')]
      .find((b) => b.textContent.includes('有意重叠'));
    ok(!!toggleBtn, '存在“标记有意重叠”按钮');
    toggleBtn.click();
    ok(document.getElementById('issue-panel').textContent.includes('已标记为有意重叠'), '重叠可标记为有意并保留说明');

    // 4b. 第一条起点改为 9500ms（晚于终点 4000 -> 倒置），第三条清空
    const startInput = document.querySelector('#list .cue-row .t-start');
    startInput.value = '00:00:09,500';
    fire(startInput, 'change');
    const ta = document.querySelectorAll('#list textarea')[2];
    ta.focus();
    ta.value = '';
    fire(ta, 'input');
    fire(ta, 'change');
    await wait(60);
    const issueText = document.getElementById('issue-panel').textContent;
    ok(/倒置|零时长/.test(issueText), '检出时间倒置');
    ok(issueText.includes('字幕文本为空'), '检出空文本');

    // 第四条终点改到 14s（视频仅 12s）
    const endInputs = document.querySelectorAll('#list .cue-row .t-end');
    endInputs[3].value = '00:00:14,000';
    fire(endInputs[3], 'change');
    ok(/超出视频时长|超时/.test(document.getElementById('issue-panel').textContent), '检出超出视频时长');

    // 5. 文字撤销栈独立工作
    const textUndoBtn = document.getElementById('undo-text');
    ok(!textUndoBtn.disabled && !document.getElementById('undo-time').disabled, '两个撤销栈均有记录');
    ok(document.querySelectorAll('#list textarea')[2].value === '', '前置条件：第三条已清空');
    textUndoBtn.click();
    ok(document.querySelectorAll('#list textarea')[2].value.length > 0, '文字栈独立撤销恢复文本');
    ok(!document.getElementById('undo-time').disabled, '撤销文字不影响时间栈');
    document.getElementById('redo-text').click();
    ok(document.querySelectorAll('#list textarea')[2].value === '', '文字重做生效');
    document.getElementById('undo-text').click(); // 恢复文本

    // 6. 时间栈：连续撤销直到倒置消失
    let guard = 0;
    while (document.getElementById('issue-panel').textContent.includes('倒置') && guard++ < 6) {
      document.getElementById('undo-time').click();
    }
    ok(!document.getElementById('issue-panel').textContent.includes('倒置'), '时间栈撤销后倒置消失');

    // 6b. 回归：修改“结束时间”入栈后，cueId 必须正确、可撤销
    const endBox = document.querySelectorAll('#list .cue-row .t-end')[1];
    const endBefore = endBox.value;
    endBox.value = '00:00:06,500';
    fire(endBox, 'change');
    ok(!document.getElementById('undo-time').disabled, '修改结束时间写入时间栈');
    const cue2Before = window.__subtitleQA.getState().cues[1].end;
    document.getElementById('undo-time').click();
    const cue2After = window.__subtitleQA.getState().cues[1].end;
    ok(cue2After !== cue2Before, '结束时间可经时间栈撤销（' + cue2Before + ' -> ' + cue2After + '）');
    ok(document.querySelectorAll('#list .cue-row .t-end')[1].value === endBefore, '撤销后结束时间输入框恢复原值');

    // 7. 搜索替换预览 + 单条替换
    document.getElementById('search-input').value = '时间';
    document.getElementById('replace-input').value = 'TIME';
    fire(document.getElementById('search-input'), 'input');
    ok(document.querySelectorAll('#search-results .sr-item').length >= 2, '搜索预览列出多条匹配');
    ok(document.getElementById('search-results').textContent.includes('TIME'), '预览显示替换后结果');
    const oneBtn = document.querySelector('[data-replace-one]');
    const targetCueId = oneBtn.closest('.sr-item').dataset.cue;
    const targetIndex = window.__subtitleQA.getState().cues.findIndex((c) => c.id === targetCueId);
    const beforeTarget = document.querySelectorAll('#list textarea')[targetIndex].value;
    ok(beforeTarget.includes('时间'), '目标条目替换前包含搜索词');
    oneBtn.click();
    const afterTarget = document.querySelectorAll('#list textarea')[targetIndex].value;
    ok(afterTarget !== beforeTarget && afterTarget.includes('TIME') && !afterTarget.includes('时间'), '单条替换生效');
    document.getElementById('undo-text').click();
    ok(document.querySelectorAll('#list textarea')[targetIndex].value === beforeTarget, '替换可经文字栈撤销');

    // 8. 正则全部替换
    document.getElementById('opt-regex').checked = true;
    document.getElementById('search-input').value = '\\d+fps';
    document.getElementById('replace-input').value = 'XXfps';
    fire(document.getElementById('search-input'), 'input');
    ok(document.getElementById('search-results').textContent.includes('XXfps'), '正则搜索替换预览正确');
    document.getElementById('replace-all').click();
    ok([...document.querySelectorAll('#list textarea')].some((t) => t.value.includes('XXfps')), '全部替换生效');
    document.getElementById('undo-text').click();
    document.getElementById('opt-regex').checked = false;

    // 9. 帧模式：显示帧码、输入帧码换算为毫秒
    const modeSel = document.getElementById('mode-select');
    modeSel.value = 'frame';
    fire(modeSel, 'input');
    fire(modeSel, 'change');
    const fi2 = document.querySelector('#list .cue-row .t-start');
    ok(fi2.value.split(':').length === 4, '帧模式输入框显示 HH:MM:SS:FF（' + fi2.value + '）');
    fi2.value = '00:00:00:10'; // 25fps -> 400ms
    fire(fi2, 'change');
    ok(document.querySelector('#list .cue-row .t-start').value === '00:00:00:10', '帧码输入被接受');

    // 10. 导出 SRT 再导入：时间与特殊字符往返一致
    let downloaded = null;
    URL.createObjectURL = (b) => { downloaded = b; return 'blob:x'; };
    URL.revokeObjectURL = () => {};
    document.getElementById('export-srt').click();
    ok(downloaded instanceof Blob, '导出 SRT 生成 Blob');
    const re = Parser.parse(await downloaded.text(), 'rt.srt');
    ok(re.cues.length === 4, '导出文件重新导入仍为 4 条');
    ok(re.cues[0].start === 400, '帧编辑后的时间导出再导入无漂移（400ms）');
    ok(re.cues[0].text.includes('<欢迎语>'), 'SRT 往返特殊字符 < > 保持一致');
    ok(re.cues[1].text.includes('c & d'), 'SRT 往返 & 字符保持一致');

    // 11. 坏文件：抢救有效条目、错误单独提示、定位行号
    await loadSubtitle(await (await fetch('../samples/malformed.srt')).text(), 'malformed.srt');
    ok(document.querySelectorAll('#list .cue-row').length === 3, '坏文件仍抢救出 3 条，未读成空白');
    ok(!document.getElementById('parse-errors').classList.contains('hidden'), '坏行以独立提示展示');
    ok(document.getElementById('parse-errors').textContent.includes('第 6 行'), '错误定位到具体行号');

    // 12. VTT 往返：实体与 cue 设置
    await loadSubtitle(await (await fetch('../samples/sample.vtt')).text(), 'sample.vtt');
    let vttBlob = null;
    URL.createObjectURL = (b) => { vttBlob = b; return 'blob:y'; };
    document.getElementById('export-vtt').click();
    const vttOut = await vttBlob.text();
    const vttBack = Parser.parse(vttOut, 'rt.vtt');
    ok(vttBack.cues[0].settings === 'line:85%', 'VTT cue 设置往返一致');
    ok(vttBack.cues[0].text.includes('<欢迎语>'), 'VTT 实体往返后文本一致');
    ok(vttOut.includes('&amp;') && vttOut.includes('&lt;'), 'VTT 导出包含转义实体');

    if (window.__smokeError) results.push({ pass: false, msg: '页面存在未捕获错误：' + window.__smokeError });
  } catch (e) {
    results.push({ pass: false, msg: '测试异常: ' + e.message + ' ' + e.stack });
  }
  document.title = 'SMOKE_DONE';
  document.getElementById('toast').textContent = JSON.stringify(results);
});
</script>
</body>
</html>
