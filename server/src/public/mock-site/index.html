<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>模拟业务受理系统（本地）</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f2f4f8; color: #1f2937;
      }
      header {
        background: #1d4ed8; color: #fff; padding: 16px 28px;
        display: flex; align-items: center; justify-content: space-between;
      }
      header h1 { font-size: 18px; margin: 0; font-weight: 600; }
      header .badge { font-size: 12px; background: rgba(255,255,255,.2); padding: 4px 10px; border-radius: 10px; }
      main { max-width: 960px; margin: 24px auto; padding: 0 16px; display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; }
      .card { background: #fff; border-radius: 10px; padding: 22px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
      .card h2 { margin: 0 0 16px; font-size: 16px; border-left: 4px solid #1d4ed8; padding-left: 8px; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; }
      .field { display: flex; flex-direction: column; gap: 4px; }
      .field.full { grid-column: 1 / -1; }
      label { font-size: 13px; color: #4b5563; }
      label .req { color: #dc2626; }
      input, select, textarea {
        border: 1px solid #d1d5db; border-radius: 6px; padding: 8px 10px; font-size: 14px; width: 100%;
      }
      input:focus, select:focus, textarea:focus { outline: 2px solid #93c5fd; border-color: #1d4ed8; }
      textarea { resize: vertical; min-height: 64px; }
      .confirm { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 14px 0; }
      .confirm input { width: auto; }
      button {
        background: #1d4ed8; color: #fff; border: 0; border-radius: 6px;
        padding: 10px 28px; font-size: 14px; cursor: pointer;
      }
      button:hover { background: #1e40af; }
      button:disabled { background: #9ca3af; cursor: not-allowed; }
      #result { margin-top: 14px; padding: 10px 14px; border-radius: 6px; font-size: 13px; display: none; }
      #result.ok, #result.err { display: block; }
      #result.ok { background: #dcfce7; color: #166534; border: 1px solid #86efac; }
      #result.err { background: #fee2e2; color: #991b1b; border: 1px solid #fca5a5; }
      table { width: 100%; border-collapse: collapse; font-size: 12px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
      th { color: #6b7280; font-weight: 600; }
      .empty { color: #9ca3af; font-size: 13px; padding: 12px 0; }
      .pill { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #dcfce7; color: #166534; font-size: 11px; }
    </style>
  </head>
  <body>
    <header>
      <h1>星辰业务受理系统 · 申请录入</h1>
      <span class="badge">本地模拟环境 · 非真实系统</span>
    </header>
    <main>
      <section class="card">
        <h2>录入申请信息</h2>
        <form id="application-form" novalidate>
          <div class="form-grid">
            <div class="field">
              <label for="applicationNo">申请编号 <span class="req">*</span></label>
              <input id="applicationNo" name="applicationNo" data-testid="input-applicationNo" required />
            </div>
            <div class="field">
              <label for="businessType">业务类型 <span class="req">*</span></label>
              <select id="businessType" name="businessType" data-testid="input-businessType" required>
                <option value="">请选择</option>
                <option>新申请</option><option>变更</option><option>续期</option><option>注销</option>
              </select>
            </div>
            <div class="field">
              <label for="applicantName">申请人姓名 <span class="req">*</span></label>
              <input id="applicantName" name="applicantName" data-testid="input-applicantName" required />
            </div>
            <div class="field">
              <label for="phone">手机号 <span class="req">*</span></label>
              <input id="phone" name="phone" data-testid="input-phone" required maxlength="11" />
            </div>
            <div class="field">
              <label for="idCard">身份证号 <span class="req">*</span></label>
              <input id="idCard" name="idCard" data-testid="input-idCard" required maxlength="18" />
            </div>
            <div class="field">
              <label for="email">邮箱 <span class="req">*</span></label>
              <input id="email" name="email" type="email" data-testid="input-email" required />
            </div>
            <div class="field">
              <label for="amount">申请金额（元） <span class="req">*</span></label>
              <input id="amount" name="amount" type="number" min="0.01" step="0.01" data-testid="input-amount" required />
            </div>
            <div class="field">
              <label for="city">所在城市 <span class="req">*</span></label>
              <input id="city" name="city" data-testid="input-city" required />
            </div>
            <div class="field full">
              <label for="address">详细住址 <span class="req">*</span></label>
              <input id="address" name="address" data-testid="input-address" required />
            </div>
            <div class="field full">
              <label for="bankAccount">银行账号 <span class="req">*</span></label>
              <input id="bankAccount" name="bankAccount" data-testid="input-bankAccount" required />
            </div>
            <div class="field full">
              <label for="remark">申请说明</label>
              <textarea id="remark" name="remark" data-testid="input-remark"></textarea>
            </div>
          </div>
          <div class="confirm">
            <input type="checkbox" id="confirmed" data-testid="checkbox-confirm" />
            <label for="confirmed" style="margin:0">我已核对以上信息，确认提交</label>
          </div>
          <button type="submit" id="submit-btn" data-testid="submit-button">提交申请</button>
          <div id="result" role="status" aria-live="polite"></div>
        </form>
      </section>
      <section class="card">
        <h2>已受理申请</h2>
        <div id="app-list"><div class="empty">暂无记录</div></div>
      </section>
    </main>
    <script>
      const form = document.getElementById('application-form');
      const result = document.getElementById('result');

      function showResult(ok, text) {
        result.className = ok ? 'ok' : 'err';
        result.textContent = text;
      }

      async function refreshList() {
        const resp = await fetch('/mock/api/applications');
        const list = await resp.json();
        const box = document.getElementById('app-list');
        if (!list.length) { box.innerHTML = '<div class="empty">暂无记录</div>'; return; }
        box.innerHTML = `<table><thead><tr><th>申请编号</th><th>业务类型</th><th>受理号</th><th>状态</th></tr></thead>
          <tbody>${list.map(a => `<tr><td>${a.applicationNo}</td><td>${a.businessType}</td><td>${a.refNo}</td><td><span class="pill">${a.status}</span></td></tr>`).join('')}</tbody></table>`;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        result.className = '';
        result.removeAttribute('style');
        const btn = document.getElementById('submit-btn');
        const data = Object.fromEntries(new FormData(form).entries());
        if (!document.getElementById('confirmed').checked) {
          showResult(false, '请先勾选"我已核对信息"确认框');
          return;
        }
        btn.disabled = true;
        btn.textContent = '提交中…';
        try {
          const resp = await fetch('/mock/api/applications', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          });
          const body = await resp.json();
          if (!resp.ok) { showResult(false, `提交失败：${body.error || resp.status}`); return; }
          showResult(true, `受理成功，受理号：${body.refNo}`);
          form.reset();
          refreshList();
        } catch (err) {
          showResult(false, `网络错误：${err.message}`);
        } finally {
          btn.disabled = false;
          btn.textContent = '提交申请';
        }
      });

      refreshList();
    </script>
  </body>
</html>
