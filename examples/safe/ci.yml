# 安全配置样例：权限最小化、动作固定到提交 SHA、不可信数据经环境变量传递
name: safe-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 固定到完整提交 SHA（注释中保留标签便于阅读）
      - uses: actions/checkout@8f4b7f84864484a7bf31766abe9204da3cbe65b3 # v4.1.1
      - name: 打印 PR 标题（安全写法：经环境变量传入）
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: 'echo "标题长度: ${#PR_TITLE}"'
      # Docker 镜像固定到摘要
      - uses: docker://alpine@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
