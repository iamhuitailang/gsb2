  <g fill="#8f979f" stroke="#4a5158" stroke-width="3">
    <rect x="4" y="4" width="118" height="118" rx="4"/>
    <rect x="134" y="4" width="118" height="118" rx="4"/>
    <rect x="4" y="134" width="118" height="118" rx="4"/>
    <rect x="134" y="134" width="118" height="118" rx="4"/>
  </g>
</svg>
