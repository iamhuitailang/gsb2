<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- 木地板粗糙度：木面中等，板缝更粗糙。 -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.2" numOctaves="3" seed="41" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.22"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="512" fill="#9a9a9a"/>
  <g stroke="#e0e0e0" stroke-width="6">
    <line x1="0" y1="128" x2="1024" y2="128"/>
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="384" x2="1024" y2="384"/>
  </g>
  <rect width="1024" height="512" filter="url(#grain)"/>
</svg>
