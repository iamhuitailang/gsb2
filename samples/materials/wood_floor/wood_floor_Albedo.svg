<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="512" viewBox="0 0 1024 512">
  <!-- 木地板颜色：4 条长木板 + 木纹。 -->
  <defs>
    <linearGradient id="wood1" x1="0" y1="0" x2="1" y2="0.2">
      <stop offset="0" stop-color="#8a5a34"/>
      <stop offset="0.3" stop-color="#a9764a"/>
      <stop offset="0.6" stop-color="#7d4f2c"/>
      <stop offset="1" stop-color="#95643c"/>
    </linearGradient>
    <linearGradient id="wood2" x1="0" y1="0" x2="1" y2="0.1">
      <stop offset="0" stop-color="#7a4b28"/>
      <stop offset="0.5" stop-color="#a06f43"/>
      <stop offset="1" stop-color="#8a5a34"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.004 0.09" numOctaves="4" seed="31" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.3"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="128" fill="url(#wood1)"/>
  <rect y="128" width="1024" height="128" fill="url(#wood2)"/>
  <rect y="256" width="1024" height="128" fill="url(#wood1)"/>
  <rect y="384" width="1024" height="128" fill="url(#wood2)"/>
  <g stroke="#3f2716" stroke-width="4">
    <line x1="0" y1="128" x2="1024" y2="128"/>
    <line x1="0" y1="256" x2="1024" y2="256"/>
    <line x1="0" y1="384" x2="1024" y2="384"/>
  </g>
  <rect width="1024" height="512" filter="url(#grain)"/>
</svg>
