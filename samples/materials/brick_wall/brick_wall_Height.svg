<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 砖墙高度（灰度）：砖面高、砖缝低。用于 HeightMask 输出的 R 通道。 -->
  <defs>
    <pattern id="rows" width="256" height="128" patternUnits="userSpaceOnUse">
      <rect width="256" height="128" fill="#282828"/>
      <rect x="6" y="6" width="244" height="116" fill="#d0d0d0"/>
      <rect x="28" y="28" width="200" height="72" fill="#e6e6e6"/>
    </pattern>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.3" numOctaves="2" seed="9" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.15"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="#282828"/>
  <rect width="1024" height="1024" fill="url(#rows)"/>
  <rect width="1024" height="1024" filter="url(#grain)"/>
</svg>
