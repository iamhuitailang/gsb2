<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 砖墙粗糙度（灰度）。砖缝更粗糙（亮），砖面中等；带噪声颗粒。 -->
  <defs>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.12" numOctaves="3" seed="3" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.25"/></feComponentTransfer>
    </filter>
    <pattern id="rows" width="256" height="128" patternUnits="userSpaceOnUse">
      <rect width="256" height="128" fill="#cfcfcf"/>
      <rect x="6" y="6" width="244" height="116" fill="#8d8d8d"/>
    </pattern>
  </defs>
  <rect width="1024" height="1024" fill="#cfcfcf"/>
  <rect width="1024" height="1024" fill="url(#rows)"/>
  <rect width="1024" height="1024" filter="url(#grain)" opacity="0.7"/>
</svg>
