<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- 金属板粗糙度：板面较光滑，焊缝处更粗糙。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d3d3d"/>
      <stop offset="0.5" stop-color="#4a4a4a"/>
      <stop offset="1" stop-color="#383838"/>
    </linearGradient>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.5" numOctaves="2" seed="23" result="n"/>
      <feColorMatrix in="n" type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.18"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#g)"/>
  <g stroke="#d8d8d8" stroke-width="12" fill="none">
    <rect x="3" y="3" width="250" height="250"/>
    <rect x="259" y="3" width="250" height="250"/>
    <rect x="3" y="259" width="250" height="250"/>
    <rect x="259" y="259" width="250" height="250"/>
  </g>
  <rect width="512" height="512" filter="url(#grain)"/>
</svg>
