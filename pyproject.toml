[project]
name = "sketchclean"
version = "0.1.0"
description = "纸面草稿本地清理工具：校正手机拍照阴影，保留浅铅笔线与实黑区域"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pillow>=10",
    "opencv-python>=4.8",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
sketchclean = "sketchclean.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sketchclean", "sketchclean.web"]
