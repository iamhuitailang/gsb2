[project]
name = "srbench"
version = "1.0.0"
description = "采样率转换试听台：两档质量对照、混叠检查、峰值对齐、导出回读核对"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
]

[project.scripts]
srbench = "srbench.cli:main"
srbench-gui = "srbench.gui_main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["srbench", "srbench.gui"]
