<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>本机 CSRF 防护验证台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", sans-serif; margin: 0; background: #f4f5f7; color: #222; }
  header { background: #1f2937; color: #fff; padding: 14px 24px; }
  header h1 { margin: 0; font-size: 18px; }
  header p { margin: 4px 0 0; font-size: 12px; color: #9ca3af; }
  main { max-width: 1080px; margin: 20px auto; padding: 0 16px; display: grid; gap: 16px; }
  section { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px 20px; }
  h2 { margin: 0 0 12px; font-size: 15px; border-left: 4px solid #2563eb; padding-left: 8px; }
  button { cursor: pointer; border: 1px solid #2563eb; background: #2563eb; color: #fff; border-radius: 6px; padding: 6px 14px; font-size: 13px; }
  button.ghost { background: #fff; color: #2563eb; }
  button.danger { background: #dc2626; border-color: #dc2626; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  input, select { padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; font-size: 13px; }
  label { font-size: 13px; display: inline-flex; align-items: center; gap: 6px; margin-right: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 8px 0; }
  .muted { color: #6b7280; font-size: 12px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 12px; }
  .ok { background: #dcfce7; color: #166534; }
  .deny { background: #fee2e2; color: #991b1b; }
  .ignore { background: #fef9c3; color: #854d0e; }
  table { border-collapse: collapse; width: 100%; font-size: 12px; }
  th, td { border: 1px solid #e5e7eb; padding: 5px 8px; text-align: left; vertical-align: top; }
  th { background: #f9fafb; }
  .demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 8px; }
  .demo-grid button { text-align: left; background: #fff; color: #1f2937; border: 1px solid #d1d5db; }
  .demo-grid button:hover { border-color: #2563eb; }
  .result { border: 1px solid #e5e7eb; border-radius: 6px; padding: 10px 12px; margin-top: 8px; font-size: 12px; }
  .result pre { background: #f9fafb; padding: 6px 8px; border-radius: 4px; overflow-x: auto; margin: 6px 0 0; }
  #msg { font-size: 13px; margin-left: 10px; }
  .kv { font-family: ui-monospace, monospace; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>本机 CSRF 防护验证台</h1>
  <p>来源精确匹配（Origin 优先 / Referer 后备 / 缺失即拒） + 会话绑定防护令牌；所有判断在服务端执行，页面只是展示同一结果。</p>
</header>
<main>
  <section>
    <h2>1. 登录（模拟账号，仅本机）</h2>
    <div class="row">
      <span>当前账号：<b id="curAccount">未登录</b></span>
      <span class="muted">会话令牌：<span class="kv" id="curToken">—</span></span>
    </div>
    <div class="row">
      <button onclick="login('alice')">登录 alice（alice123）</button>
      <button onclick="login('bob')">登录 bob（bob123）</button>
      <button class="danger" onclick="logout()">退出登录</button>
      <span id="msg"></span>
    </div>
    <div class="muted">登录 / 退出 / 重新登录都会使旧令牌失效；同一会话多个页面取到的是同一令牌，不会互相作废。</div>
  </section>

  <section>
    <h2>2. 设置变更（真实修改数据）</h2>
    <div class="row">
      <label>昵称 <input id="fName" size="14"></label>
      <label>邮箱 <input id="fEmail" size="20"></label>
      <label>主题 <select id="fTheme"><option value="light">light</option><option value="dark">dark</option></select></label>
      <button onclick="saveSettings()">保存设置（POST + 来源 + 令牌）</button>
    </div>
    <div class="muted">当前数据：<span class="kv" id="curSettings">—</span></div>
  </section>

  <section>
    <h2>3. 本地请求演示（可重复点击，服务端真实发起请求）</h2>
    <div class="demo-grid" id="demoBtns"></div>
    <div id="demoResults"></div>
  </section>

  <section>
    <h2>4. 操作日志（账号 + 结果 + 原因，不含令牌 / Cookie）</h2>
    <div class="row"><button class="ghost" onclick="loadLogs()">刷新日志</button></div>
    <table>
      <thead><tr><th>时间</th><th>账号</th><th>动作</th><th>结果</th><th>原因</th></tr></thead>
      <tbody id="logBody"></tbody>
    </table>
  </section>
</main>

<script>
let csrfToken = null;

async function api(path, { method = 'GET', body, withToken = false } = {}) {
  const headers = {};
  if (body !== undefined) headers['content-type'] = 'application/json';
  if (withToken && csrfToken) headers['x-csrf-token'] = csrfToken;
  const res = await fetch(path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined });
  return { status: res.status, json: await res.json().catch(() => null) };
}

function say(text, ok = true) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.color = ok ? '#166534' : '#991b1b';
}

async function refreshMe() {
  const { status, json } = await api('/api/me');
  if (status !== 200) {
    csrfToken = null;
    document.getElementById('curAccount').textContent = '未登录';
    document.getElementById('curToken').textContent = '—';
    document.getElementById('curSettings').textContent = '—';
    return;
  }
  document.getElementById('curAccount').textContent = json.account;
  document.getElementById('curSettings').textContent = JSON.stringify(json.settings);
  document.getElementById('fName').value = json.settings.displayName;
  document.getElementById('fEmail').value = json.settings.email;
  document.getElementById('fTheme').value = json.settings.theme;
  const t = await api('/api/token');
  csrfToken = t.json.token;
  document.getElementById('curToken').textContent = csrfToken.slice(0, 6) + '…(已隐藏)';
}

async function login(account) {
  const password = account === 'alice' ? 'alice123' : 'bob123';
  const { status, json } = await api('/api/login', { method: 'POST', body: { account, password } });
  say(status === 200 ? `已登录 ${account}，旧会话令牌已失效` : (json && json.reason) || '登录失败', status === 200);
  await refreshMe(); await loadLogs();
}

async function logout() {
  const { status, json } = await api('/api/logout', { method: 'POST', withToken: true });
  say(status === 200 ? '已退出，会话与令牌已销毁' : (json && json.reason) || '退出失败', status === 200);
  await refreshMe(); await loadLogs();
}

async function saveSettings() {
  const body = {
    displayName: document.getElementById('fName').value,
    email: document.getElementById('fEmail').value,
    theme: document.getElementById('fTheme').value,
  };
  const { status, json } = await api('/api/settings', { method: 'POST', body, withToken: true });
  say(status === 200 ? '保存成功' : '被拒绝：' + ((json && json.reason) || ''), status === 200);
  await refreshMe(); await loadLogs();
}

async function runDemo(scenario) {
  const { status, json } = await api('/api/demo', { method: 'POST', body: { scenario }, withToken: true });
  const box = document.getElementById('demoResults');
  if (status !== 200) {
    box.insertAdjacentHTML('afterbegin', `<div class="result">演示请求本身被拒绝：${(json && json.reason) || ''}</div>`);
    return;
  }
  const r = json.result;
  const badge = r.allowed ? '<span class="badge ok">允许</span>' : (r.status >= 400 ? '<span class="badge deny">拒绝</span>' : '<span class="badge ignore">忽略</span>');
  const changed = r.changed ? '<span class="badge ok">数据已改变</span>' : '<span class="badge deny">数据未改变</span>';
  box.insertAdjacentHTML('afterbegin', `
    <div class="result">
      <b>${r.title}</b> ${badge} ${changed}
      <div class="muted">HTTP ${r.status} ｜ ${r.reason}</div>
      <pre>请求: ${r.request.method} ${r.request.url}\n头部: ${JSON.stringify(r.request.headers, null, 2)}\n变更前: ${JSON.stringify(r.before)}${r.after ? '\n变更后: ' + JSON.stringify(r.after) : ''}</pre>
    </div>`);
  await refreshMe(); await loadLogs();
}

async function loadLogs() {
  const { json } = await api('/api/logs');
  const rows = (json.logs || []).map(l => {
    const cls = l.result === '允许' ? 'ok' : (l.result === '拒绝' ? 'deny' : 'ignore');
    return `<tr><td>${l.time.slice(11, 19)}</td><td>${l.account}</td><td>${l.action}</td><td><span class="badge ${cls}">${l.result}</span></td><td>${l.reason}</td></tr>`;
  }).join('');
  document.getElementById('logBody').innerHTML = rows || '<tr><td colspan="5" class="muted">暂无日志</td></tr>';
}

async function init() {
  const { json } = await api('/api/demo-scenarios');
  document.getElementById('demoBtns').innerHTML =
    json.scenarios.map(s => `<button onclick="runDemo('${s.id}')">${s.title}</button>`).join('');
  await refreshMe(); await loadLogs();
}
init();
</script>
</body>
</html>
