<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTPack — 游戏材质贴图通道打包工具</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>MTPack</strong>
      <span class="muted">材质贴图通道打包工具 · 纯浏览器本地运行，不上传任何文件</span>
    </div>
    <div class="toolbar">
      <label class="btn primary">
        载入贴图（可多选）
        <input type="file" id="file-input" accept=".png,.jpg,.jpeg,.webp,.bmp,.gif,image/*" multiple hidden />
      </label>
      <button class="btn" id="sample-btn" type="button">载入内置样例</button>
      <button class="btn" id="save-btn" type="button">保存工程</button>
      <label class="btn">
        打开工程
        <input type="file" id="open-project" accept=".json,application/json" hidden />
      </label>
      <button class="btn accent" id="export-btn" type="button">批量导出 ZIP</button>
    </div>
  </header>

  <main class="layout">
    <section class="pane pane-left">
      <div class="pane-section">
        <h2>全局设置</h2>
        <div id="settings-panel"></div>
      </div>
      <div class="pane-section grow">
        <h2>输出与通道映射</h2>
        <div id="outputs-panel"></div>
      </div>
    </section>

    <section class="pane pane-mid">
      <div class="pane-section grow">
        <h2>材质分组</h2>
        <div id="groups-panel" class="scroll"></div>
      </div>
      <div class="pane-section log-section">
        <h2>操作日志</h2>
        <div id="status-log" class="scroll log-box"></div>
      </div>
    </section>

    <section class="pane pane-right">
      <div class="pane-section grow">
        <h2>预览</h2>
        <div id="preview-panel" class="scroll"></div>
      </div>
      <div class="pane-section" id="normal-preview-panel">
        <h2>法线表面效果</h2>
        <div class="light-control">
          <label for="light-angle">光源方位角</label>
          <input type="range" id="light-angle" />
        </div>
        <div id="normal-preview-host"></div>
      </div>
      <div class="pane-section log-section">
        <h2>批量结果（成功项保留，失败项列原因）</h2>
        <div id="batch-log" class="scroll log-box"></div>
      </div>
    </section>
  </main>

  <!-- 样例数据为生成物（npm run generate:samples）；缺失时页面仍可正常使用 -->
  <script src="samples/sample-data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/image.js"></script>
  <script src="js/batch.js"></script>
  <script src="js/preview.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
