<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>账号系统演示</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">账号系统</a>
    <span class="spacer"></span>
    <a href="/login.html">登录</a>
    <a href="/register.html">注册</a>
    <a href="/forgot.html">忘记密码</a>
    <a href="/inbox.html">收件箱</a>
  </nav>
  <main class="container">
    <div class="card">
      <h1>本地账号与密码恢复演示</h1>
      <p class="subtitle">
        演示账号：<code>demo@example.com</code> / <code>password123</code>
      </p>
      <p>本项目演示一条完整的“忘记密码”恢复链路：</p>
      <ol>
        <li>在<a href="/forgot.html">忘记密码页</a>提交邮箱，无论邮箱是否注册都得到相同回复；</li>
        <li>重置链接发送到项目自带的<a href="/inbox.html">内置收件箱</a>，无需真实邮箱；</li>
        <li>链接绑定账号与用途，过期或用过一次即失效；</li>
        <li>改密成功后，所有旧会话与其它未使用的重置链接全部失效。</li>
      </ol>
      <div class="hint">
        想手动验证？先在两个浏览器（或一个普通窗口 + 一个隐身窗口）登录同一账号，再申请两次重置链接。
      </div>
    </div>
  </main>
</body>
</html>
