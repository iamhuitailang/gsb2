<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>登录</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/">账号系统</a>
    <span class="spacer"></span>
    <a href="/inbox.html">收件箱</a>
  </nav>
  <main class="container">
    <div class="card">
      <h1>登录</h1>
      <p class="subtitle">使用邮箱和密码登录</p>
      <form id="login-form">
        <label for="email">邮箱</label>
        <input id="email" name="email" type="email" autocomplete="username" required />
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required />
        <button type="submit">登录</button>
        <div id="msg" class="message"></div>
      </form>
      <p class="hint">
        <a href="/forgot.html">忘记密码？</a>　·　还没有账号？<a href="/register.html">注册</a>
      </p>
    </div>
  </main>
  <script type="module">
    import { api, showMessage } from '/common.js';
    const form = document.getElementById('login-form');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const { data } = await api('/api/login', {
        method: 'POST',
        body: {
          email: document.getElementById('email').value,
          password: document.getElementById('password').value,
        },
      });
      if (data.user) {
        window.location.href = '/profile.html';
      } else {
        showMessage(msg, data.error || '登录失败');
      }
    });
  </script>
</body>
</html>
