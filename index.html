<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>剧情织机 Storyloom · 对话与分支编辑器</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">S</div>
          <div class="brand-text">
            <strong>剧情织机</strong>
            <span>Storyloom</span>
          </div>
        </div>

        <div class="project-title">
          <input id="project-title" class="title-input" aria-label="剧情标题" />
          <span class="save-state" id="save-state">已保存</span>
        </div>

        <div class="topbar-actions">
          <label class="field inline">
            <span>编辑语言</span>
            <select id="text-locale" class="select" aria-label="编辑语言"></select>
          </label>
          <div class="btn-group">
            <button class="btn ghost" id="btn-undo" title="撤销 (Ctrl/Cmd+Z)">↶ 撤销</button>
            <button class="btn ghost" id="btn-redo" title="重做 (Ctrl/Cmd+Shift+Z)">↷ 重做</button>
          </div>
          <div class="status-pills" id="status-pills"></div>
          <div class="btn-group">
            <button class="btn ghost" id="btn-validation" title="检查问题">检查</button>
            <button class="btn ghost" id="btn-translations" title="翻译工作台">翻译</button>
            <button class="btn ghost" id="btn-settings" title="项目设置">设置</button>
          </div>
          <div class="btn-group">
            <button class="btn" id="btn-new">新建</button>
            <button class="btn" id="btn-open">打开</button>
            <button class="btn" id="btn-save">保存</button>
            <button class="btn primary" id="btn-export">导出剧情</button>
          </div>
          <button class="btn accent" id="btn-preview" title="试玩 (P)">▶ 试玩</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="sidebar" id="sidebar">
          <div class="sidebar-tabs" role="tablist">
            <button class="tab active" data-tab="outline">大纲</button>
            <button class="tab" data-tab="variables">变量</button>
            <button class="tab" data-tab="characters">角色</button>
          </div>
          <div class="sidebar-body" id="sidebar-body"></div>
        </aside>

        <section class="stage">
          <div class="stage-toolbar">
            <div class="toolbar-group">
              <button class="btn small" id="btn-add-node">＋ 节点</button>
              <button class="btn small ghost" id="btn-auto-layout">自动排版</button>
              <button class="btn small ghost" id="btn-fit">适应视图</button>
            </div>
            <div class="toolbar-hint" id="graph-hint">拖动节点移动 · 从右侧圆点拖出连线 · 双击空白新建 · 滚轮缩放</div>
            <div class="toolbar-group">
              <label class="field inline compact">
                <span>高亮</span>
                <select class="select" id="graph-highlight">
                  <option value="all">全部</option>
                  <option value="issues">问题节点</option>
                  <option value="missing">缺译节点</option>
                  <option value="cycles">循环路径</option>
                </select>
              </label>
            </div>
          </div>
          <div class="graph-wrap" id="graph-wrap">
            <canvas id="graph"></canvas>
            <div class="graph-empty" id="graph-empty" hidden>
              还没有节点。双击空白区域，或点击「＋ 节点」开始。
            </div>
            <div class="graph-legend">
              <span><i class="legend-start"></i>开始</span>
              <span><i class="legend-entry"></i>入口</span>
              <span><i class="legend-choice"></i>选项连线</span>
              <span><i class="legend-next"></i>默认出口</span>
              <span><i class="legend-issue"></i>问题</span>
              <span><i class="legend-cycle"></i>循环</span>
            </div>
            <div class="graph-zoom">
              <button class="icon-btn" id="btn-zoom-out" aria-label="缩小">−</button>
              <span id="zoom-level">100%</span>
              <button class="icon-btn" id="btn-zoom-in" aria-label="放大">＋</button>
            </div>
          </div>
        </section>

        <aside class="inspector" id="inspector">
          <div class="inspector-empty" id="inspector-empty">
            <div class="empty-illustration">⌘</div>
            <p>选择一个节点开始编辑</p>
            <p class="muted">在图中点击节点，或从左侧大纲跳转。</p>
          </div>
          <div class="inspector-body" id="inspector-body" hidden></div>
        </aside>
      </main>

      <section class="preview-panel" id="preview-panel" hidden>
        <div class="preview-head">
          <div class="preview-title">
            <span class="live-dot"></span>
            <strong>运行预览</strong>
            <span class="muted" id="preview-meta"></span>
          </div>
          <div class="preview-controls">
            <label class="field inline compact">
              <span>起点</span>
              <select class="select" id="preview-entry"></select>
            </label>
            <label class="field inline compact">
              <span>语言</span>
              <select class="select" id="preview-locale"></select>
            </label>
            <button class="btn small" id="btn-preview-restart">↺ 重新开始</button>
            <button class="icon-btn" id="btn-preview-close" aria-label="关闭预览">✕</button>
          </div>
        </div>
        <div class="preview-body">
          <div class="preview-stage" id="preview-stage"></div>
          <div class="preview-side">
            <div class="preview-side-section">
              <h4>剧情变量</h4>
              <div class="var-table" id="preview-variables"></div>
            </div>
            <div class="preview-side-section grow">
              <h4>经过的节点 <span class="muted" id="preview-step-count"></span></h4>
              <ol class="history-list" id="preview-history"></ol>
            </div>
          </div>
        </div>
      </section>
    </div>

    <div class="modal-root" id="modal-root"></div>
    <div class="toast-root" id="toast-root"></div>
    <input type="file" id="file-input" accept="application/json,.json" hidden />
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
