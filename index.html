<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>多角度角色素材预览器</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --line: #334155;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --warn: #f59e0b;
    --danger: #f87171;
    --ok: #34d399;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 13px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; white-space: nowrap; }
  .selftest { font-size: 12px; padding: 3px 9px; border-radius: 999px; white-space: nowrap; }
  .selftest.pass { background: rgba(52,211,153,.15); color: var(--ok); }
  .selftest.fail { background: rgba(248,113,113,.15); color: var(--danger); }
  .global-controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-left: auto; }
  label.ctl { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); }
  select, button, input[type=text] {
    background: var(--panel-2); color: var(--text); border: 1px solid var(--line);
    border-radius: 7px; padding: 5px 9px; font-size: 12px; outline: none;
  }
  button { cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: #0369a1; border-color: #0ea5e9; }
  input[type=range] { accent-color: var(--accent); }
  input[type=checkbox] { accent-color: var(--accent); }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  @media (max-width: 1100px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column;
  }
  .panel.synced { border-color: rgba(56,189,248,.55); }
  .panel-head { display: flex; gap: 8px; align-items: center; padding: 9px 12px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .panel-head .tag { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--panel-2); color: var(--muted); }
  .panel-head .tag.a { color: #7dd3fc; }
  .panel-head .tag.b { color: #c4b5fd; }
  .panel-head input.label-input { width: 130px; }
  .spacer { flex: 1; }
  .panel-body { display: grid; grid-template-columns: minmax(260px, 1fr) 190px; gap: 10px; padding: 10px; }
  .stage-col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .stage-wrap {
    position: relative; background:
      linear-gradient(rgba(148,163,184,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(148,163,184,.06) 1px, transparent 1px),
      #0b1220;
    background-size: 20px 20px;
    border: 1px solid var(--line); border-radius: 8px; min-height: 260px;
  }
  canvas.stage { display: block; width: 100%; height: 320px; cursor: ew-resize; }
  .stage-overlay {
    position: absolute; top: 8px; left: 8px; right: 8px;
    display: flex; justify-content: space-between; gap: 8px; pointer-events: none;
  }
  .badge-pill {
    background: rgba(15,23,42,.82); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px; font-size: 11px; color: var(--muted);
    white-space: nowrap;
  }
  .badge-pill.subst { color: var(--warn); border-color: rgba(245,158,11,.5); }
  .badge-pill.unresolved { color: var(--danger); border-color: rgba(248,113,113,.5); }
  .badge-pill.held { color: #fbbf24; border-color: rgba(251,191,36,.4); }
  .badge-pill.transit { color: var(--accent); border-color: rgba(56,189,248,.45); }
  .stage-hint { position: absolute; bottom: 6px; left: 8px; font-size: 10.5px; color: #64748b; pointer-events: none; }
  .timeline-row { display: flex; align-items: center; gap: 8px; }
  .timeline-row input[type=range] { flex: 1; }
  .filmstrip { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; }
  .thumb {
    flex: 0 0 auto; width: 62px; border: 2px solid transparent; border-radius: 6px;
    background: var(--panel-2); cursor: pointer; position: relative; overflow: hidden;
  }
  .thumb.active { border-color: var(--accent); }
  .thumb.missing { border-style: dashed; border-color: var(--danger); }
  .thumb canvas { display: block; width: 100%; }
  .thumb .meta { font-size: 9.5px; color: var(--muted); text-align: center; padding: 1px 0; white-space: nowrap; }
  .thumb .miss-x {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    color: var(--danger); font-size: 20px; font-weight: 700;
  }

  .side-col { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .dial-wrap { display: flex; justify-content: center; }
  .dial { width: 170px; height: 170px; cursor: grab; touch-action: none; pointer-events: all; }
  .dial:active { cursor: grabbing; }
  .side-box { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .side-box h3 { margin: 0 0 6px; font-size: 11.5px; color: var(--muted); font-weight: 600; letter-spacing: .04em; }
  .side-box .row { display: flex; align-items: center; gap: 6px; margin: 5px 0; flex-wrap: wrap; }
  .anchor-fields input { width: 64px; }
  .report { max-height: 190px; overflow: auto; font-size: 11.5px; }
  .report .item { padding: 4px 6px; border-radius: 6px; margin-bottom: 3px; display: flex; gap: 6px; align-items: center; }
  .report .item.frame { background: rgba(251,191,36,.08); color: #fcd34d; }
  .report .item.dir { background: rgba(248,113,113,.08); color: var(--danger); }
  .report .item.ok { background: rgba(52,211,153,.08); color: var(--ok); }
  .report .item .sub { color: var(--warn); }
  .report .item .mirror-off { color: var(--muted); }
  .readout { font-variant-numeric: tabular-nums; color: var(--accent); }
  .mini-btn { padding: 3px 7px; font-size: 11px; }
  .footer-note { color: #64748b; font-size: 11px; padding: 0 14px 14px; }
  .toast {
    position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
    background: #0c4a6e; border: 1px solid var(--accent); color: #e0f2fe;
    padding: 8px 16px; border-radius: 999px; font-size: 12px; opacity: 0;
    transition: opacity .25s; pointer-events: none; z-index: 50;
  }
  .toast.show { opacity: 1; }
  .kbd { background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 10.5px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>多角度角色素材预览器</h1>
  <span id="selftest-badge" class="selftest">自检中…</span>
  <div class="global-controls">
    <label class="ctl">动作
      <select id="global-action"></select>
    </label>
    <button id="btn-play" class="primary">⏸ 暂停</button>
    <label class="ctl">同步双面板 <input type="checkbox" id="chk-sync" checked /></label>
    <button id="btn-sweep">整圈扫掠测试（3s）</button>
    <button id="btn-export-all">导出全部示例 JSON</button>
    <label class="ctl" title="导入由本工具导出的 manifest JSON">导入 manifest
      <input type="file" id="file-import" accept="application/json,.json" hidden />
      <button id="btn-import" class="mini-btn">选择文件…</button>
    </label>
  </div>
</header>

<div class="grid">
  <section class="panel" id="panel-a-root"></section>
  <section class="panel" id="panel-b-root"></section>
</div>

<p class="footer-note">
  操作：在画面上左右拖动或拖动转盘改变镜头角度；时间轴拖动可 scrub 动作进度；点击缩略图选帧后可在右侧直接编辑脚底锚点（拖画面里的锚点也可以）。
  替代素材会在画面左上角标出，关闭镜像后缺方向显示占位。所有修改自动保存在浏览器 localStorage。
</p>

<div class="toast" id="toast"></div>

<script src="js/angle.js"></script>
<script src="js/sprites.js"></script>
<script src="js/example-data.js"></script>
<script src="js/exporter.js"></script>
<script src="js/selftest.js"></script>
<script src="js/viewer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
