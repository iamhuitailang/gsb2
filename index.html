<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>钟声采样乐器</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <h1>钟声采样乐器 <span class="subtitle">Bell Sampler</span></h1>
        <div id="engine-status" class="engine-status">音频引擎初始化中…</div>
      </header>
      <div id="load-banner" class="load-banner hidden"></div>
      <main class="layout">
        <section class="column main-column">
          <div class="panel">
            <div class="panel-head">
              <h2>键盘</h2>
              <div class="velocity-control">
                <span>力度</span>
                <input id="velocity" type="range" min="1" max="127" value="96" />
                <span id="velocity-value">96</span>
                <button id="vel-soft" class="btn small">轻敲</button>
                <button id="vel-hard" class="btn small">重敲</button>
              </div>
            </div>
            <div id="keyboard" class="keyboard"></div>
            <p class="hint">电脑键盘映射标注在琴键上；按住持续发声（仅带循环段的样本），松开进入尾音。</p>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2>最近发声（实际使用的样本）</h2>
              <span id="voice-count" class="badge">活动声部 0</span>
            </div>
            <div id="voice-log" class="voice-log">
              <div class="empty-hint">尚无发声</div>
            </div>
          </div>
        </section>
        <aside class="column side-column">
          <div class="panel">
            <div class="panel-head"><h2>样本状态</h2></div>
            <div id="sample-status" class="sample-status"><div class="empty-hint">加载中…</div></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>循环接头试听</h2></div>
            <div id="splice-panel"></div>
          </div>
          <div class="panel">
            <div class="panel-head">
              <h2>演奏记录</h2>
              <span id="rec-indicator" class="rec-dot"></span>
            </div>
            <div id="transport" class="transport"></div>
          </div>
          <div class="panel">
            <div class="panel-head"><h2>声部管理</h2></div>
            <div id="voice-policy"></div>
          </div>
        </aside>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
