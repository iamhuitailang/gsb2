<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>本地相似短音频检查器</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <h1>本地相似短音频检查器</h1>
          <p class="subtitle">音量归一、头尾裁切、重采样后仍可对齐；所有分析与状态均在本机完成。</p>
        </div>
        <div class="top-actions">
          <button id="sampleBtn" class="btn secondary" type="button">生成并载入示例</button>
          <button id="scanBtn" class="btn primary" type="button">重新扫描</button>
        </div>
      </header>

      <section class="panel add-panel" aria-labelledby="addTitle">
        <div class="add-row">
          <div>
            <h2 id="addTitle">添加音频</h2>
            <p class="hint">支持 WAV；若本机有 ffmpeg，也支持 MP3、M4A、FLAC、OGG 等。重复添加同一文件不会重复建索引。</p>
          </div>
          <div class="add-actions">
            <input id="fileInput" type="file" multiple accept="audio/*,.wav,.mp3,.m4a,.flac,.ogg,.aiff" hidden />
            <button id="pickBtn" class="btn primary" type="button">选择多个文件</button>
            <a class="btn ghost" href="/api/export?format=json">导出 JSON</a>
            <a class="btn ghost" href="/api/export?format=csv">导出 CSV</a>
          </div>
        </div>
        <details class="path-details">
          <summary>按服务器本地绝对路径添加（每行一个；不会移动或修改原文件）</summary>
          <div class="path-row">
            <textarea id="pathInput" rows="2" placeholder="/Users/you/sounds/a.wav&#10;/Users/you/sounds/b.wav"></textarea>
            <button id="pathBtn" class="btn secondary" type="button">添加路径</button>
          </div>
        </details>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </section>

      <section id="stats" class="stats-grid" aria-label="扫描统计"></section>

      <div class="workspace">
        <aside class="panel library" aria-labelledby="libraryTitle">
          <div class="section-head">
            <h2 id="libraryTitle">音频库</h2>
            <label class="mini-check"><input id="showRemoved" type="checkbox" /> 显示已移除</label>
          </div>
          <div id="fileList" class="file-list"></div>
          <section id="unreadableSection" class="side-section" hidden>
            <h3>读不到的文件</h3>
            <div id="unreadableList" class="unreadable-list"></div>
          </section>
          <section id="removedSection" class="side-section" hidden>
            <h3>已移除记录</h3>
            <div id="removedList" class="removed-list"></div>
          </section>
        </aside>

        <main class="results-area">
          <section class="panel controls-panel">
            <div class="filter-tabs" role="tablist" aria-label="结果分类筛选">
              <button class="tab active" data-filter="all" type="button">全部 <span data-count="all">0</span></button>
              <button class="tab high" data-filter="high" type="button">● 高度相似 <span data-count="high">0</span></button>
              <button class="tab uncertain" data-filter="uncertain" type="button">▲ 证据不足 <span data-count="uncertain">0</span></button>
              <button class="tab different" data-filter="different" type="button">○ 明显不同 <span data-count="different">0</span></button>
              <button class="tab false_positive" data-filter="false_positive" type="button">× 已标误判 <span data-count="false_positive">0</span></button>
              <button class="tab confirmed" data-filter="confirmed" type="button">✓ 已确认 <span data-count="confirmed">0</span></button>
            </div>
            <div class="scan-controls">
              <label>高相似阈值
                <input id="highThreshold" type="number" min="0.70" max="0.95" step="0.01" />
              </label>
              <label>存疑阈值
                <input id="uncertainThreshold" type="number" min="0.50" max="0.80" step="0.01" />
              </label>
              <button id="applyParamsBtn" class="btn secondary small" type="button">应用并重扫</button>
            </div>
            <input id="searchInput" class="search" type="search" placeholder="按文件名筛选…" />
          </section>

          <section id="results" class="results-list" aria-live="polite"></section>
          <div id="emptyState" class="panel empty-state">
            <h2>还没有可查看的相似结果</h2>
            <p>点击“生成并载入示例”可立即得到：原始音效、+7dB、−12dB、头尾裁短、中段截取、单声道重采样，以及一段同音色但旋律不同的近似素材和持续单音边界样本。</p>
          </div>
          <section id="historyPanel" class="panel history-panel" hidden>
            <details id="historyDetails">
              <summary><strong>历史判定 / 已移除文件中的结果</strong> <span id="historyCount" class="hint"></span></summary>
              <div id="historyList" class="results-list history-list"></div>
            </details>
          </section>
        </main>
      </div>
    </div>
    <script src="/app.js" defer></script>
  </body>
</html>
